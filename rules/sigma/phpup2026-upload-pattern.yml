title: phpup-2026 Oversized session.upload_progress Multipart Body (Spray Heuristic)
id: 7d9e1b23-4f6a-4c8d-9a2e-5b1f3d7e9c0a
status: stable
description: |
  PHPSESSID cookie in a multipart POST, combined with a body far larger
  than a progress-tracked upload's own form fields need to be.
  CVE-2026-109619 requires reclaiming freed arData with a heap spray,
  which needs many >=288-byte blobs — legitimate upload_progress usage
  does not produce bodies this size from form fields alone. Threshold
  (40000) is a generic spray-size heuristic, not tied to any one released
  tool's field count; tune to this deployment's normal non-file form
  overhead if the web server log includes the uploaded file's own bytes
  in cs-bytes.

  Standard web-server access logs do not capture POST body field names
  (see phpup2026-feature-presence.yml), so this cannot directly confirm
  the PHP_SESSION_UPLOAD_PROGRESS field name itself — it is a
  method+content-type+cookie+size structural proxy, not a payload match.
  (An earlier revision had a `cs-bytes|contains:
  'PHP_SESSION_UPLOAD_PROGRESS'` clause checking a numeric byte-count
  field for a string; confirmed via a real Sigma-condition evaluator
  against real captured events that this could never match, and removed.)
references:
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.t1190
  - cve.2026.109619
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: 'POST'
  selection_ct:
    cs-headers|contains: 'multipart/form-data'
  selection_cookie:
    cs-cookie|contains: 'PHPSESSID='
  selection_size:
    cs-bytes|gte: 40000
  condition: all of selection_*
falsepositives:
  - legitimate file uploads using session.upload_progress with a large file,
    on a web server that logs the raw body size including the file itself —
    tune the threshold or exclude by endpoint/Content-Type if so
level: high
