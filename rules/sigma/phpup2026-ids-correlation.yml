title: phpup-2026 IDS Alert for rfc1867 OOM-Amplification / Bailout State Corruption
id: 6a2f8d14-5b9e-4c3a-8f1d-2e7b4a6c9d0f
status: stable
description: |
  2026-10-21 rewrite: the prior revision of this rule mapped to Suricata
  SIDs (9109628-9109630, 9109632) built on the now-retired single-request
  spray/byte-offset mechanism -- see ANALYSIS.md and rules/suricata.rules'
  own "retired" section. This maps instead to the SIDs that survived that
  rewrite: the duplicate Content-Disposition header (9109633) and header-
  density (9109634) signals, grounded directly in the real fix commit's
  rfc1867.c changes, and the empty-file-field signal (9109635). These are
  IDS-category (not webserver-category) because they need actual HTTP
  body inspection (Suricata's http.request_body), which standard web
  server access logs do not capture -- see phpup2026-feature-presence.yml
  for the equivalent webserver-only precondition signal. Alert
  signature_ids are defined by this repo's suricata.rules and must match
  the deployed ruleset.
references:
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.t1190
  - cve.2026.109618
  - cve.2026.109619
logsource:
  category: ids
  product: suricata
detection:
  selection:
    alert.signature_id:
      - 9109633
      - 9109634
      - 9109635
  condition: selection
falsepositives:
  - 9109634/9109635 are density-based approximations (Suricata has no
    native occurrence-count keyword) and need tuning against this
    deployment's real multi-file-upload traffic; weight 9109633
    (exact duplicate-header match) higher
level: high
