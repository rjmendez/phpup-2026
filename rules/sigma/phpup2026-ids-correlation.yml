title: phpup-2026 IDS Alert for rfc1867 OOM-Amplification / Bailout State Corruption
id: 6a2f8d14-5b9e-4c3a-8f1d-2e7b4a6c9d0f
status: stable
description: |
  2026-10-21 rewrite: the prior revision of this rule mapped to Suricata
  SIDs (9109628-9109630, 9109632) built on the now-retired single-request
  spray/byte-offset mechanism -- see ANALYSIS.md and rules/suricata.rules'
  own "retired" section. This maps instead to the SID that survived that
  rewrite: the duplicate-header-name signal (9109633), grounded directly
  in the real fix commit's rfc1867.c changes. IDS-category (not
  webserver-category) because it needs actual HTTP body inspection
  (Suricata's http.request_body), which standard web server access logs
  do not capture -- see phpup2026-feature-presence.yml for the
  equivalent webserver-only precondition signal. Alert signature_ids are
  defined by this repo's suricata.rules and must match the deployed
  ruleset.

  2026-10-21, same day, second fix: this rule briefly also listed 9109634
  (a density-proxy extension of 9109633) - that SID was retired the same
  day it was added, caught failing its own Python test cases before ever
  being deployed. Removed from the selection list below; it was never a
  live SID in any shipped ruleset, so no deployment ever relied on it.

  2026-10-21, same day, third fix: this rule also listed 9109635 (empty
  file fields), which was separately proven to false-positive on a real,
  entirely legitimate 4-file upload (examples/pcaps/
  phpup2026-real-legit-multifile-benign.pcap) and retired in
  rules/suricata.rules with that evidence. Removed from the selection
  list below for the same reason as 9109634.

  2026-10-21, same day, honesty note (not a fix): checked SigmaHQ's own
  repository (github.com/SigmaHQ/sigma) for precedent on this rule's
  `category: ids, product: suricata` logsource and the dotted
  `alert.signature_id` field path - found zero hits for either
  "product: suricata" or "category: ids" anywhere in that repo. There
  is no established SigmaHQ community convention for consuming Suricata
  EVE JSON via Sigma at all; this logsource/field combination is this
  repo's own ad-hoc choice, not a validated taxonomy. That said, the
  field itself is real and verified the strongest way available here:
  directly observed, repeatedly, in this repo's own genuine EVE JSON
  captures throughout this investigation (examples/logs/
  phpup2026-eve-*.json all use this exact `{"alert":{"signature_id":
  ...}}` structure) - stronger evidence than documentation, just not
  backed by SigmaHQ precedent the way the other two rules' fields are.
references:
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.t1190
  - cve.2026.109618
  - cve.2026.109619
logsource:
  category: ids
  product: suricata
detection:
  selection:
    alert.signature_id:
      - 9109633
  condition: selection
falsepositives:
  - None known at this signature_id alone (9109633 is live-fire verified
    against both the real OOM-amplification captures and a real
    legitimate multi-file upload, see rules/suricata.rules) -- but any
    future SID added to the selection list above should be held to the
    same bar before shipping, per 9109634/9109635's retirement history.
level: high
