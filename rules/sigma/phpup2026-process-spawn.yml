title: phpup-2026 Shell Spawned by PHP Process
id: 4b9d2e51-7c3a-4e8f-b1d5-3e5a2c7f9d1b
status: experimental
description: |
  Shell or interpreter spawned under the PHP worker process user (www-data,
  nobody, lsphp). Generically valid as a PHP child-process-monitoring
  indicator regardless of root cause. 2026-10-21: previously described as
  "RCE via system() from the forged zend_fcall_info chain" -- that specific
  payload chain was the artifact's own claim and has not been confirmed
  against the real fix (php/php-src commit 82f8f31b16a); see ANALYSIS.md.
  The rule's value as a post-exploitation indicator doesn't depend on
  which mechanism caused the RCE.

  2026-10-21, second fix: checked this rule's field names against
  SigmaHQ's own repository (github.com/SigmaHQ/sigma). `CommandLine` and
  `ParentCommandLine` are both real and used in a directly analogous
  real merged rule (rules/linux/process_creation/
  proc_creation_lnx_webshell_detection.yml, "Linux Webshell Indicators"),
  but that rule keys its parent-process check on `ParentImage|endswith`
  (the full executable path, e.g. '/httpd', '/apache2', '/nginx'), not
  `ParentCommandLine|contains`. Added `ParentImage|endswith` here too,
  as the more precise, better-precedented check, alongside the existing
  `ParentCommandLine` check rather than replacing it: this repo's own
  real capture (examples/logs/phpup2026-sysmonlinux-shell-spawn.log) has
  `ParentImage: /usr/sbin/php-fpm8.3` alongside `ParentCommandLine:
  php-fpm: pool www`, so both are confirmed populated for php-fpm, and
  keeping `ParentCommandLine|contains: 'php-fpm'` as a fallback costs
  nothing. `User` has no real precedent in SigmaHQ's own Linux
  process_creation corpus (searched: zero hits with any modifier outside
  two unrelated rules) - most Linux collectors feeding this category are
  auditd-based and don't commonly populate or filter on it - but it is a
  real field in Sysmon-for-Linux's own schema, which is what this
  repo's own real capture above was built against; kept as-is, not
  proven wrong, just less commonly relied on elsewhere.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.execution
  - attack.t1059.004
  - cve.2026.109618
  - cve.2026.109619
logsource:
  category: process_creation
  product: linux
detection:
  selection_user:
    User|contains:
      - 'www-data'
      - 'nobody'
      - 'lsphp'
      - 'apache'
  selection_parent:
    ParentCommandLine|contains:
      - 'php-fpm'
      - 'lsphp'
  selection_parent_image:
    ParentImage|re: '.*/(php-fpm[0-9.]*|lsphp[0-9]*|apache2|httpd)$'
  selection_cmd:
    CommandLine|contains:
      - '/bin/sh'
      - '/bin/bash'
      - 'python'
      - 'curl '
      - 'wget '
      - 'nc '
      - 'bash -i'
  condition: (selection_user or selection_parent or selection_parent_image) and selection_cmd
falsepositives:
  - cron jobs running as www-data - suppress known-good parent commands
level: high
