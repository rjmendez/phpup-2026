title: phpup-2026 Shell Spawned by PHP Process
id: 4b9d2e51-7c3a-4e8f-b1d5-3e5a2c7f9d1b
status: experimental
description: |
  Shell or interpreter spawned under the PHP worker process user (www-data,
  nobody, lsphp). Indicates successful RCE via system() from the forged
  zend_fcall_info chain.
references:
  - http://jackalsyn.com/posts/phpupAssets/php-up-2026.tar.gz
tags:
  - attack.execution
  - attack.t1059.004
  - cve.2026.109618
  - cve.2026.109619
logsource:
  category: process_creation
  product: linux
detection:
  selection_user:
    User|contains:
      - 'www-data'
      - 'nobody'
      - 'lsphp'
      - 'apache'
  selection_parent:
    ParentCommandLine|contains:
      - 'php-fpm'
      - 'lsphp'
  selection_cmd:
    CommandLine|contains:
      - '/bin/sh'
      - '/bin/bash'
      - 'python'
      - 'curl '
      - 'wget '
      - 'nc '
      - 'bash -i'
  condition: (selection_user or selection_parent) and selection_cmd
falsepositives:
  - cron jobs running as www-data — suppress known-good parent commands
level: high
