title: phpup-2026 session.upload_progress Feature Reachable From Internet
id: 9c4e6b31-2d8f-4a71-9e5c-7b1d3f6a8c2e
status: stable
description: |
  Baseline precondition for CVE-2026-109619: a multipart POST with a
  PHPSESSID cookie, meaning session.upload_progress is reachable and
  plausibly in use. This is also exactly how the legitimate progress-bar
  feature is used, so it is an inventory/policy signal (who still exposes
  this surface) and a prerequisite filter for the higher-confidence rules
  below, not an attack signal on its own.

  Standard web-server access logs (W3C/IIS, nginx/Apache combined format)
  do not capture POST body field names, so this cannot directly confirm
  the PHP_SESSION_UPLOAD_PROGRESS field name itself -- it is a
  method+cookie structural proxy, not a payload match. (An earlier
  revision of this rule had a `cs-bytes|contains:
  'PHP_SESSION_UPLOAD_PROGRESS'` clause checking a numeric byte-count
  field for a string; confirmed via a real Sigma-condition evaluator
  against real captured events that this could never match, and removed.)

  2026-10-21, second fix: this rule also had a `cs-headers|contains:
  'multipart/form-data'` clause. Checked against SigmaHQ's own
  repository (github.com/SigmaHQ/sigma): `cs-method` and `cs-cookie` are
  real, established field names for `category: webserver` (used in
  real merged rules and SigmaHQ's own field-name test fixtures), but
  `cs-headers` returns zero hits anywhere in that repo -- not a real
  Sigma field for this category, the same invented-field mistake already
  caught in this repo's Azure Sentinel content (AzureDiagnostics'
  `requestBody_s`, W3CIISLog's `csHeaders`). Worse here than there:
  because the rule's condition was `all of selection_*`, a selection
  keyed on a field that never exists in real data made the ENTIRE rule
  permanently unable to fire, not just weaker. Standard web-server
  access logging (the thing `category: webserver` actually models) does
  not capture request headers like Content-Type at all, the same root
  cause as W3CIISLog's missing `csHeaders` -- there is no field to
  rename this to. Removed the clause; this rule can no longer
  distinguish a multipart POST from any other POST with the same
  cookie, same honest trade-off already made for the Sentinel version.
references:
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.t1190
  - cve.2026.109619
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: 'POST'
  selection_cookie:
    cs-cookie|contains: 'PHPSESSID='
  condition: all of selection_*
falsepositives:
  - legitimate use of the upload-progress-bar feature
level: informational
