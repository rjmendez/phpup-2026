title: phpup-2026 session.upload_progress Feature Reachable From Internet
id: 9c4e6b31-2d8f-4a71-9e5c-7b1d3f6a8c2e
status: stable
description: |
  Baseline precondition for CVE-2026-109619: a multipart POST with a
  PHPSESSID cookie, meaning session.upload_progress is reachable and
  plausibly in use. This is also exactly how the legitimate progress-bar
  feature is used, so it is an inventory/policy signal (who still exposes
  this surface) and a prerequisite filter for the higher-confidence rules
  below, not an attack signal on its own.

  Standard web-server access logs (W3C/IIS, nginx/Apache combined format)
  do not capture POST body field names, so this cannot directly confirm
  the PHP_SESSION_UPLOAD_PROGRESS field name itself -- it is a
  method+content-type+cookie structural proxy, not a payload match. (An
  earlier revision of this rule had a `cs-bytes|contains:
  'PHP_SESSION_UPLOAD_PROGRESS'` clause checking a numeric byte-count
  field for a string; confirmed via a real Sigma-condition evaluator
  against real captured events that this could never match, and removed.)
references:
  - https://github.com/rjmendez/phpup-2026
tags:
  - attack.t1190
  - cve.2026.109619
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: 'POST'
  selection_ct:
    cs-headers|contains: 'multipart/form-data'
  selection_cookie:
    cs-cookie|contains: 'PHPSESSID='
  condition: all of selection_*
falsepositives:
  - legitimate use of the upload-progress-bar feature
level: informational
